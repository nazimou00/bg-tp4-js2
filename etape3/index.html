<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des étudiants</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <div id="table_container">

        <h2>Liste des étudiants</h2>

        <table id="tableau">

            <thead>
                <tr>
                    <th>N</th>
                    <th>Nom</th>
                    <th>Prénom</th>
                    <th>Points</th>
                    <th>Select</th>
                </tr>
            </thead>

            <tbody>
                <!-- Rows added by JavaScript -->
            </tbody>

        </table>

        <div class="buttons">

            <button onclick="doInsert('nom', 'prenom', 10)">
                Ajouter
            </button>

            <button onclick="consoleTableau()">
                Console Tableau
            </button>

        </div>

    </div>

</body>
</html>
